<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Studio · Videos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1d1f'/%3E%3Cpath d='M7 8h18v12H14l-5 4v-4H7z' fill='%23d4ff3f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/studio/studio.css">
<link rel="stylesheet" href="/studio/editor.css">
</head>
<body data-mode="view" class="editor">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-view" viewBox="0 0 20 20"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-comment" viewBox="0 0 20 20"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v8a1.5 1.5 0 0 1-1.5 1.5H8l-4 3.2V14h.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-adjust" viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2"/><rect x="2" y="2" width="4" height="4" fill="currentColor"/><rect x="14" y="14" width="4" height="4" fill="currentColor"/></symbol>
    <symbol id="i-block" viewBox="0 0 20 20"><rect x="2.5" y="3" width="9" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="11" width="15" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3" width="4" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 6.5V4.5A1.5 1.5 0 0 0 12 3H4.5A1.5 1.5 0 0 0 3 4.5V12a1.5 1.5 0 0 0 1.5 1.5h2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2m-6 0 .7 10h6.6L14 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-parent" viewBox="0 0 20 20"><path d="M10 16V5m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reopen" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 3.5V7h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tx" viewBox="0 0 20 20"><path d="M3 4.5 10 10 3 15.5zM17 4.5 10 10l7 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-panel" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 3.5v13" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><rect x="5" y="4.5" width="3.5" height="11" rx="0.5" fill="currentColor"/><rect x="11.5" y="4.5" width="3.5" height="11" rx="0.5" fill="currentColor"/></symbol>
    <symbol id="i-video" viewBox="0 0 20 20"><rect x="2.5" y="5" width="11" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13.5 9 4-2.5v7l-4-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-import" viewBox="0 0 20 20"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M3.5 12v3.5A1.5 1.5 0 0 0 5 17h10a1.5 1.5 0 0 0 1.5-1.5V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-split" viewBox="0 0 20 20"><path d="M10 2.5v15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 6h4.5v8H3M17 6h-4.5v8H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 20 20"><path d="M7.5 14.5V4.5l9-2v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="5.5" cy="14.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14.5" cy="12.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m3 14 4.5-4.5 3.5 3.5 2-2 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-deck" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 7.5h6M5 10.5h3.5M10 13.5V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-scene" viewBox="0 0 20 20"><path d="M2.5 13.5h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="5" cy="13.5" r="2.2" fill="currentColor"/><circle cx="15" cy="13.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 8.5h6.5L10.5 6.5h2.6l2.9 3-2.9 3h-2.6l2-2H6z" fill="currentColor"/></symbol>
    <symbol id="i-text" viewBox="0 0 20 20"><path d="M4 5V3.5h12V5M10 3.5v13M7.5 16.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="deck-name">
    <nav class="apps" aria-label="Pitch Studio">
      <a href="/">Decks</a>
      <a href="/edit" aria-current="page">Videos</a>
    </nav>
    <span class="sep" aria-hidden="true">/</span>
    <select id="projectSelect" aria-label="Video project"></select>
    <form id="newForm" class="new-form" hidden>
      <input id="newName" placeholder="Name, e.g. Launch video" aria-label="New video name" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" type="submit">Create</button>
      <button class="icon-btn" type="button" id="newCancel" title="Cancel (Esc)"><svg><use href="#i-close"/></svg></button>
    </form>
  </div>

  <div class="modes" role="radiogroup" aria-label="Mode">
    <button role="radio" data-mode="view" aria-checked="true" title="Edit (V)"><svg><use href="#i-view"/></svg><span>Edit</span><kbd>V</kbd></button>
    <button role="radio" data-mode="comment" aria-checked="false" title="Comment on a moment (C)"><svg><use href="#i-comment"/></svg><span>Comment</span><kbd>C</kbd></button>
    <button role="radio" data-mode="adjust" aria-checked="false" title="Move &amp; resize overlays (A)"><svg><use href="#i-adjust"/></svg><span>Adjust</span><kbd>A</kbd></button>
    <button role="radio" data-mode="block" aria-checked="false" title="Sketch what goes on screen (B)"><svg><use href="#i-block"/></svg><span>Block</span><kbd>B</kbd></button>
  </div>

  <div class="actions">
    <span class="live" id="live" data-state="connecting" title="Live reload">
      <i aria-hidden="true"></i><span>Connecting</span>
    </span>
    <button class="btn" id="togglePanel" aria-pressed="true" title="Show or hide the side panel (F)"><svg><use href="#i-panel"/></svg><span>Panel</span><b class="count" id="panelCount" hidden></b></button>
    <button class="btn" id="copyPrompt" title="Copy an instruction for Claude Code"><svg><use href="#i-copy"/></svg><span>Copy prompt for Claude</span></button>
    <button class="btn btn-primary" id="renderBtn" title="Render the edit to MP4 from the original footage"><svg><use href="#i-video"/></svg><span>Render MP4</span></button>
  </div>
</header>

<nav class="strip bin" aria-label="Media and building blocks">
  <section class="bin-sec">
    <header><h2>Footage</h2>
      <button class="btn btn-ghost bin-import" id="importBtn" title="Import video, audio or images (or drop files anywhere)"><svg><use href="#i-import"/></svg><span>Import</span></button>
      <input type="file" id="fileInput" multiple accept="video/*,audio/*,image/*" hidden>
    </header>
    <ol id="mediaList" class="bin-list"></ol>
  </section>
  <section class="bin-sec">
    <header><h2>Overlays</h2></header>
    <div class="ov-grid" id="overlayButtons">
      <button class="ov-add" data-kind="title" title="Title plate over the footage"><svg><use href="#i-text"/></svg>Title</button>
      <button class="ov-add" data-kind="lower" title="Name and role, lower third"><svg><use href="#i-text"/></svg>Lower third</button>
      <button class="ov-add" data-kind="label" title="Short label"><svg><use href="#i-text"/></svg>Label</button>
      <button class="ov-add" data-kind="arrow" title="Transit arrow pointing at something"><svg><use href="#i-scene"/></svg>Arrow</button>
      <button class="ov-add" data-kind="highlight" title="Orange frame around the thing that matters"><svg><use href="#i-adjust"/></svg>Highlight</button>
    </div>
  </section>
  <section class="bin-sec">
    <header><h2>Deck scenes</h2></header>
    <ol id="deckList" class="bin-list"></ol>
  </section>
  <section class="bin-sec">
    <header><h2>Animations</h2></header>
    <ol id="sceneList" class="bin-list"></ol>
  </section>
</nav>

<main class="stage" id="stage">
  <div class="canvas" id="canvas">
    <div class="frames" id="frames"></div>
    <div class="overlay" id="overlay"></div>
    <div class="empty-stage" id="emptyStage" hidden></div>
  </div>
  <div class="transport" id="transport">
    <button class="icon-btn play" id="playBtn" title="Play (Space)" aria-label="Play"><svg><use href="#i-play"/></svg></button>
    <span class="time" id="timeLabel">00:00.0 / 00:00.0</span>
    <span class="t-sep" aria-hidden="true"></span>
    <button class="icon-btn" id="splitBtn" title="Split the clip at the playhead (S)" aria-label="Split"><svg><use href="#i-split"/></svg></button>
    <button class="icon-btn" id="deleteBtn" title="Remove the selected clip (Delete)" aria-label="Remove clip"><svg><use href="#i-trash"/></svg></button>
    <span class="warn" id="warnings" hidden></span>
  </div>
</main>

<aside class="panel" aria-label="Clip and feedback">
  <div class="panel-head">
    <div class="seg" role="tablist" aria-label="Panel">
      <button role="tab" data-tab="clip" aria-selected="true">Clip</button>
      <button role="tab" data-tab="feedback" aria-selected="false">Feedback <b id="countAll">0</b></button>
    </div>
    <div class="seg" role="tablist" aria-label="Status" id="statusTabs" hidden>
      <button role="tab" data-status="open" aria-selected="true">Open <b id="countOpen">0</b></button>
      <button role="tab" data-status="done" aria-selected="false">Done <b id="countDone">0</b></button>
    </div>
  </div>
  <div class="inspector" id="inspector"></div>
  <ol class="fb-list" id="fbList" hidden></ol>
</aside>

<section class="timeline" id="timeline" aria-label="Timeline">
  <div class="tl-heads" id="tlHeads"></div>
  <div class="tl-scroll" id="tlScroll">
    <div class="tl-body" id="tlBody">
      <div class="ruler" id="ruler"></div>
      <div class="lanes" id="lanes"></div>
      <div class="playhead" id="playhead"><i></i></div>
    </div>
  </div>
  <div class="tl-zoom">
    <button class="icon-btn" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 20 20"><path d="M5 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="btn btn-ghost" id="zoomFit" title="Fit the whole edit (0)">Fit</button>
    <button class="icon-btn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
  </div>
</section>

<footer class="statusbar">
  <span id="hint"></span>
  <span class="coords" id="coords"></span>
</footer>

<div class="drop-hint" id="dropHint" hidden><p>Drop to import</p></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/studio/editor.js"></script>
</body>
</html>
