<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1d1f'/%3E%3Cpath d='M7 8h18v12H14l-5 4v-4H7z' fill='%23d4ff3f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/studio/studio.css">
</head>
<body data-mode="view">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-view" viewBox="0 0 20 20"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-comment" viewBox="0 0 20 20"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v8a1.5 1.5 0 0 1-1.5 1.5H8l-4 3.2V14h.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-adjust" viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2"/><rect x="2" y="2" width="4" height="4" fill="currentColor"/><rect x="14" y="14" width="4" height="4" fill="currentColor"/></symbol>
    <symbol id="i-block" viewBox="0 0 20 20"><rect x="2.5" y="3" width="9" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="11" width="15" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3" width="4" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-export" viewBox="0 0 20 20"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M3.5 13v2.5A1.5 1.5 0 0 0 5 17h10a1.5 1.5 0 0 0 1.5-1.5V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 6.5V4.5A1.5 1.5 0 0 0 12 3H4.5A1.5 1.5 0 0 0 3 4.5V12a1.5 1.5 0 0 0 1.5 1.5h2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2m-6 0 .7 10h6.6L14 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-parent" viewBox="0 0 20 20"><path d="M10 16V5m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reopen" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 3.5V7h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-panel" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 3.5v13" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="deck-name">
    <span class="app">Pitch Studio</span>
    <span class="sep" aria-hidden="true">/</span>
    <span id="deckTitle">…</span>
  </div>

  <div class="modes" role="radiogroup" aria-label="Mode">
    <button role="radio" data-mode="view" aria-checked="true" title="View (V)"><svg><use href="#i-view"/></svg><span>View</span><kbd>V</kbd></button>
    <button role="radio" data-mode="comment" aria-checked="false" title="Comment (C)"><svg><use href="#i-comment"/></svg><span>Comment</span><kbd>C</kbd></button>
    <button role="radio" data-mode="adjust" aria-checked="false" title="Move &amp; resize (A)"><svg><use href="#i-adjust"/></svg><span>Adjust</span><kbd>A</kbd></button>
    <button role="radio" data-mode="block" aria-checked="false" title="Sketch layout blocks (B)"><svg><use href="#i-block"/></svg><span>Block</span><kbd>B</kbd></button>
  </div>

  <div class="actions">
    <span class="live" id="live" data-state="connecting" title="Live reload">
      <i aria-hidden="true"></i><span>Connecting</span>
    </span>
    <button class="btn" id="togglePanel" aria-pressed="true" title="Show or hide the feedback panel (F)"><svg><use href="#i-panel"/></svg><span>Feedback</span><b class="count" id="panelCount" hidden></b></button>
    <button class="btn" id="copyPrompt" title="Copy an instruction for Claude Code"><svg><use href="#i-copy"/></svg><span>Copy prompt for Claude</span></button>
    <button class="btn btn-primary" id="exportPdf"><svg><use href="#i-export"/></svg><span>Export PDF</span></button>
  </div>
</header>

<nav class="strip" aria-label="Slides">
  <ol id="slideList"></ol>
  <button class="btn btn-ghost sketch-new" id="sketchNew" title="Sketch a new slide after the current one"><svg><use href="#i-plus"/></svg><span>Sketch new slide</span></button>
</nav>

<main class="stage" id="stage">
  <div class="canvas" id="canvas">
    <iframe id="slideFrame" title="Slide preview" tabindex="-1"></iframe>
    <div class="sketch-ground" id="sketchGround" hidden></div>
    <div class="overlay" id="overlay"></div>
  </div>
</main>

<aside class="panel" aria-label="Feedback">
  <div class="panel-head">
    <h2>Feedback</h2>
    <div class="seg" role="tablist" aria-label="Scope">
      <button role="tab" data-scope="slide" aria-selected="true">This slide</button>
      <button role="tab" data-scope="all" aria-selected="false">All slides</button>
    </div>
    <div class="seg" role="tablist" aria-label="Status">
      <button role="tab" data-status="open" aria-selected="true">Open <b id="countOpen">0</b></button>
      <button role="tab" data-status="done" aria-selected="false">Done <b id="countDone">0</b></button>
    </div>
  </div>
  <ol class="fb-list" id="fbList"></ol>
</aside>

<footer class="statusbar">
  <span id="hint"></span>
  <span class="coords" id="coords"></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/studio/studio.js"></script>
</body>
</html>
